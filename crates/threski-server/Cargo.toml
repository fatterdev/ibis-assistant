[package]
name = "threski-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "threski"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.7.0", features = ["server", "macros", "schemars", "transport-async-rw", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session", "transport-worker", "client", "transport-streamable-http-client", "__reqwest", "transport-streamable-http-client-reqwest"] }
schemars = "1.2.3"

threski-core.workspace = true
threski-logger.workspace = true
threski-git.workspace = true
threski-db.workspace = true
threski-ai.workspace = true
threski-ingest-git.workspace = true
threski-ingest-code.workspace = true
threski-ingest-logs.workspace = true
threski-ingest-dynamic.workspace = true
threski-ingest-redmine.workspace = true
threski-search.workspace = true
threski-ticketing.workspace = true
threski-repopr.workspace = true
threski-optimization.workspace = true
threski-settings.workspace = true
threski-wizard.workspace = true
threski-cli.workspace = true
threski-httpserver.workspace = true

tokio.workspace = true
tokio-util = "0.7"
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
async-trait.workspace = true
tempfile.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
reqwest.workspace = true
base64.workspace = true
# Row decoding + typed datetime bindings (SurrealValue derive expands
# `surrealdb::` paths, so the crate must be in scope — same pattern as
# threski-db).
surrealdb = { version = "3.3.4", features = ["protocol-ws"] }

# Windows SCM service lifecycle (D10)
windows-service = "0.8"

[dev-dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }