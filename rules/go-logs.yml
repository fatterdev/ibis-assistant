id: go-logs
language: go
rule:
  any:
    # Common printf-style logger APIs (single arg and with format args)
    - pattern: $LOGGER.Info($FORMAT, $$$ARGS)
    - pattern: $LOGGER.Info($FORMAT)
    - pattern: $LOGGER.Debug($FORMAT, $$$ARGS)
    - pattern: $LOGGER.Debug($FORMAT)
    - pattern: $LOGGER.Warn($FORMAT, $$$ARGS)
    - pattern: $LOGGER.Warn($FORMAT)
    - pattern: $LOGGER.Error($FORMAT, $$$ARGS)
    - pattern: $LOGGER.Error($FORMAT)
    - pattern: $LOGGER.Fatal($FORMAT, $$$ARGS)
    - pattern: $LOGGER.Fatal($FORMAT)
    - pattern: $LOGGER.Print($FORMAT, $$$ARGS)
    - pattern: $LOGGER.Print($FORMAT)
    - pattern: $LOGGER.Printf($FORMAT, $$$ARGS)
    - pattern: $LOGGER.Printf($FORMAT)
    - pattern: $LOGGER.Println($FORMAT, $$$ARGS)
    - pattern: $LOGGER.Println($FORMAT)
    # stdlib log
    - pattern: log.Printf($FORMAT, $$$ARGS)
    - pattern: log.Printf($FORMAT)
    - pattern: log.Print($FORMAT, $$$ARGS)
    - pattern: log.Print($FORMAT)
    - pattern: log.Println($FORMAT, $$$ARGS)
    - pattern: log.Println($FORMAT)
    - pattern: log.Fatalf($FORMAT, $$$ARGS)
    - pattern: log.Fatalf($FORMAT)
    # slog (message is first string arg)
    - pattern: slog.Info($FORMAT, $$$ARGS)
    - pattern: slog.Info($FORMAT)
    - pattern: slog.Debug($FORMAT, $$$ARGS)
    - pattern: slog.Debug($FORMAT)
    - pattern: slog.Warn($FORMAT, $$$ARGS)
    - pattern: slog.Warn($FORMAT)
    - pattern: slog.Error($FORMAT, $$$ARGS)
    - pattern: slog.Error($FORMAT)
    - pattern: slog.InfoContext($CTX, $FORMAT, $$$ARGS)
    - pattern: slog.DebugContext($CTX, $FORMAT, $$$ARGS)
    - pattern: slog.WarnContext($CTX, $FORMAT, $$$ARGS)
    - pattern: slog.ErrorContext($CTX, $FORMAT, $$$ARGS)
