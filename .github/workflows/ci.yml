name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        env:
          # Authenticated GitHub API for SurrealDB/ast-grep sidecars when the
          # e2e gate seeds them beside the binary (anonymous calls hit 403).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo test --workspace
      - run: cargo build --workspace

  ide-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node ide-host/src/bridge_framing_test.mjs
      - run: node ide-host/src/session_test.mjs
      - run: node ide-host/src/http_actor_test.mjs

  # A1 retrieval eval (ddofds fase 0) + C8 observations eval (fase 5): golden
  # datasets over a live SurrealDB sidecar with the deterministic offline
  # embedder (retrieval) and no LLM at all (observations). The 4.0 retrieval
  # baseline is recorded in docs/planning/2026-11-02-a1-retrieval-eval-plan.md
  # - the 0.75 floor catches gross ranking regressions.
  retrieval-eval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Start SurrealDB sidecar (pinned)
        run: |
          docker run -d --name surreal -p 38000:8000 surrealdb/surrealdb:v4.0.0 \
            start -u root -p root --bind 0.0.0.0:8000
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:38000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:38000/health
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ibis-server
      - name: Retrieval eval (offline embedder)
        run: ./target/debug/ibis eval retrieval --dataset evaluations/retrieval/dataset.yaml --embedder offline --min-recall-5 0.75 --out artifacts/eval/retrieval-offline.json
      - name: Observations eval (deterministic clusters)
        run: ./target/debug/ibis eval observations --dataset evaluations/observations/dataset.yaml --out artifacts/eval/observations.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-report
          path: artifacts/eval/

  # Live SurrealDB integration gate (remediation plan section 10): the live
  # suites of every crate that owns SurrealQL run against the pinned v4.0.0
  # sidecar with IBIS_LIVE_REQUIRED=1 — an unreachable server or a skipped
  # live test FAILS the job (no silent skips in CI).
  live-tests:
    runs-on: ubuntu-24.04
    env:
      IBIS_SPIKE_SURREAL_URL: ws://127.0.0.1:38000
      IBIS_LIVE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Start SurrealDB sidecar (pinned)
        run: |
          docker run -d --name surreal -p 38000:8000 surrealdb/surrealdb:v4.0.0 \
            start -u root -p root --bind 0.0.0.0:8000
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:38000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:38000/health
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GITHUB_TOKEN: authenticated GitHub API for the SurrealDB/ast-grep
      # sidecar downloads the process-lifecycle tests may trigger.
      - name: Live tests (ibis-db)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo test -p ibis-db --test live_surreal
      - name: Live tests (ibis-ingest-code)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo test -p ibis-ingest-code --tests
      - name: Live tests (ibis-ingest-logs)
        run: cargo test -p ibis-ingest-logs --test live_logs
      - name: Live tests (ibis-search)
        run: cargo test -p ibis-search --test live_memory_estate
      - name: Live tests (ibis-search observations)
        run: cargo test -p ibis-search --test live_observations
      - name: Live tests (ibis-optimization observations)
        run: cargo test -p ibis-optimization --test live_observations
      - name: Live tests (ibis-server)
        run: cargo test -p ibis-server --test live_commit_txn
