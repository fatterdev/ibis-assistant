name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p ibis-server -p mcp-bridge --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/ibis.exe" dist/release/
            cp "target/${{ matrix.target }}/release/mcp-bridge.exe" dist/release/
          else
            cp "target/${{ matrix.target }}/release/ibis" dist/release/
            cp "target/${{ matrix.target }}/release/mcp-bridge" dist/release/
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: ibis-${{ matrix.target }}
          path: dist/release

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for d in artifacts/ibis-*; do
            target="${d#artifacts/ibis-}"
            if [ -f "$d/ibis.exe" ]; then
              cp "$d/ibis.exe" "release/ibis-${target}.exe"
              cp "$d/mcp-bridge.exe" "release/mcp-bridge-${target}.exe"
            else
              cp "$d/ibis" "release/ibis-${target}"
              cp "$d/mcp-bridge" "release/mcp-bridge-${target}"
            fi
          done
          zip -r release/ibis-assistant-cursor-plugin.zip cursor-plugin/
          (cd release && sha256sum * > ../SHA256SUMS.txt && mv ../SHA256SUMS.txt ./)
      - name: Attest release artifacts (provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*
